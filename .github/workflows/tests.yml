name: tests

# Unit tests plus the replay against the backtest (verification/fixtures.npz holds 100 real sessions per ETF, so this
# runs offline). A failing replay means the bot no longer reproduces the strategy as it was backtested.
on:
  push:
    paths-ignore:
      - "state/**"
      - "ledger/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
